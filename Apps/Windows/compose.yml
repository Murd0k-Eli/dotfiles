services:
  windows:
    image: dockurr/windows
    container_name: windows
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "2"
    volumes:
      - ./win_data:/storage
    stop_grace_period: 2m
    restart: always
