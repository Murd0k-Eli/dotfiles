services:
  windows:
    image: dockurr/windows
    container_name: windows
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    environment:
      VERSION: "custom"
      RAM_SIZE: "8G"
      CPU_CORES: "2"
      DISK_SIZE: "96G"
#      ARGUMENTS: "-cpu host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time"
#      CPU_MODEL: "qemu64"
#      SHUTDOWN: "N"
#      BOOT_MODE: "uefi"
    volumes:
      - /home/kumar/Apps/Windows/win_data/win11x64.iso:/storage/custom.iso
      - /home/kumar/Apps/Windows/win_data:/storage
      - ~/Media:/storage/shared
    stop_grace_period: 2m
    restart: always
